services:
  aistudio-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: aistudio-api-cloud:p1
    container_name: aistudio-api
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:6080:6080"
    volumes:
      - aistudio-api-p1-data:/app/data
      - aistudio-api-browser-cache:/root/.cloakbrowser
      - ../config.yaml:/app/config.yaml
    environment:
      AISTUDIO_PORT: "8080"
      AISTUDIO_BROWSER: "chromium"
      AISTUDIO_BROWSER_PORT: "9222"
      AISTUDIO_BROWSER_HEADLESS: "1"
      AISTUDIO_ACCOUNTS_DIR: "/app/data/accounts"
      AISTUDIO_API_KEY: "${AISTUDIO_API_KEY:?Set AISTUDIO_API_KEY in .env}"
      AISTUDIO_REQUIRE_API_KEY: "1"
      AISTUDIO_PROXY: "${AISTUDIO_PROXY:-}"
      AISTUDIO_MAX_CONCURRENCY: "1"
      AISTUDIO_ENABLE_DISPLAY: "1"
      AISTUDIO_SKIP_BROWSER_WARMUP: "1"
      AISTUDIO_DISPLAY_NUM: "99"
      AISTUDIO_VNC_PORT: "5900"
      AISTUDIO_NOVNC_PORT: "6080"
      AISTUDIO_DISPLAY_GEOMETRY: "1280x720x24"
    mem_limit: 1800m
    cpus: 1.75
    shm_size: 512m
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

volumes:
  aistudio-api-p1-data:
    name: aistudio-api-p1-data
  aistudio-api-browser-cache:
    name: aistudio-api-browser-cache
