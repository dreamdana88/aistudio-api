# Oracle tea-party deploy. API and noVNC are published on the host loopback only.
# Do not add 5900, 9222, or 9223, and do not switch this service to host networking:
# websockify listens on 0.0.0.0 inside the container, and host mode would publish it.
# Host memory and CPU caps are unset on purpose. The old 1800m limit was a
# single-request budget, not a measured cap for three generations.

services:
  aistudio-api:
    image: ${AISTUDIO_IMAGE:?Pin AISTUDIO_IMAGE to ghcr.io/dreamdana88/aistudio-api@sha256:<manifest-list-digest>}
    container_name: aistudio-oracle
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${AISTUDIO_BIND_PORT:-18081}:8080"
      - "127.0.0.1:${AISTUDIO_NOVNC_BIND_PORT:-6080}:6080"
    volumes:
      - aistudio-oracle-data:/app/data
      - aistudio-oracle-browser-cache:/root/.cloakbrowser
      - ../config.yaml:/app/config.yaml
    environment:
      AISTUDIO_PORT: "8080"
      AISTUDIO_BROWSER: "chromium"
      AISTUDIO_BROWSER_PORT: "9222"
      AISTUDIO_BROWSER_HEADLESS: "1"
      AISTUDIO_REDUCED_MOTION: "${AISTUDIO_REDUCED_MOTION:-1}"
      AISTUDIO_ACCOUNTS_DIR: "/app/data/accounts"
      AISTUDIO_API_KEY: "${AISTUDIO_API_KEY:?Set AISTUDIO_API_KEY to a new token of at least 32 characters}"
      AISTUDIO_REQUIRE_API_KEY: "1"
      AISTUDIO_PROXY: "${AISTUDIO_PROXY:-}"
      AISTUDIO_MAX_CONCURRENCY: "3"
      AISTUDIO_ENABLE_DISPLAY: "1"
      AISTUDIO_SKIP_BROWSER_WARMUP: "${AISTUDIO_SKIP_BROWSER_WARMUP:-0}"
      AISTUDIO_NOVNC_PUBLIC_URL: "${AISTUDIO_NOVNC_PUBLIC_URL:?Set AISTUDIO_NOVNC_PUBLIC_URL to https://LOGIN_DOMAIN:8443}"
      AISTUDIO_NOVNC_PORT: "6080"
      AISTUDIO_VNC_PORT: "5900"
      CLOAKBROWSER_CACHE_DIR: "/root/.cloakbrowser"
      CLOAKBROWSER_AUTO_UPDATE: "false"
    shm_size: 1gb
    pids_limit: 1024
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

volumes:
  aistudio-oracle-data:
    name: aistudio-oracle-data
  aistudio-oracle-browser-cache:
    name: aistudio-oracle-browser-cache
